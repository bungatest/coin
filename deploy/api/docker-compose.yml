version: '3.8'

services:
  coin-scanner:
    build:
      context: ..
      dockerfile: api/Dockerfile
    container_name: rupiah-coin-scanner
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - WORKERS=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
